<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lucky Draw — Secret Panel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a14;color:#fff;min-height:100vh}
#pin-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.pin-card{background:#12121f;border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:40px 32px;width:100%;max-width:360px;text-align:center}
.pin-dots{display:flex;justify-content:center;gap:12px;margin:24px 0}
.pin-dot{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);transition:all .2s}
.pin-dot.on{background:#f59e0b;border-color:#f59e0b;box-shadow:0 0 8px rgba(245,158,11,.5)}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:240px;margin:0 auto}
.nk{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:#fff;border-radius:12px;padding:16px;font-size:20px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
.nk:hover{background:rgba(245,158,11,.15);border-color:rgba(245,158,11,.4)}
.nk:active{transform:scale(.93)}
#pin-err{color:#ef4444;font-size:13px;margin-top:14px;height:18px;transition:opacity .3s}
#main{display:none;min-height:100vh;flex-direction:column}
.bar{background:#12121f;border-bottom:1px solid rgba(255,255,255,.07);padding:14px 24px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.bar-title{font-size:16px;font-weight:800}
.bar-evt{margin-left:auto;font-size:12px;color:rgba(255,255,255,.4);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lock-btn{background:none;border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.5);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit;margin-left:10px;flex-shrink:0}
.wrap{max-width:960px;margin:0 auto;padding:28px 20px 60px}
.sec-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.35);margin-bottom:10px}
.esel{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:13px 16px;color:#fff;font-size:15px;outline:none;cursor:pointer;margin-bottom:24px}
.esel:focus{border-color:#f59e0b}
.esel option{background:#12121f}
#picker{display:none}

/* Forced winner status card */
#forced-status{background:linear-gradient(135deg,rgba(245,158,11,.15),rgba(217,119,6,.08));border:1px solid rgba(245,158,11,.3);border-radius:14px;padding:16px 20px;margin-bottom:20px;display:none}
#forced-status .fs-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#f59e0b;margin-bottom:8px}
#forced-status .fs-name{font-size:18px;font-weight:800;color:#fff;margin-bottom:4px}
#forced-status .fs-sub{font-size:13px;color:rgba(255,255,255,.5)}
.btn-clear-forced{background:none;border:1px solid rgba(239,68,68,.3);color:#fca5a5;border-radius:8px;padding:6px 14px;font-size:12px;cursor:pointer;font-family:inherit;margin-top:10px}

.srch{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:13px 16px;color:#fff;font-size:14px;outline:none;margin-bottom:12px}
.srch:focus{border-color:#f59e0b}
.srch::placeholder{color:rgba(255,255,255,.3)}
#vcount{font-size:12px;color:rgba(255,255,255,.35);margin-bottom:8px}
#vlist{max-height:360px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.vrow{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:11px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .15s}
.vrow:hover{border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.05)}
.vrow.sel{border-color:#f59e0b;background:rgba(245,158,11,.1)}
.vav{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;flex-shrink:0}
.vname{font-size:14px;font-weight:600}
.vmeta{font-size:12px;color:rgba(255,255,255,.4);margin-top:2px}
.vchk{margin-left:auto;font-size:20px;opacity:0;transition:opacity .15s}
.vrow.sel .vchk{opacity:1}
.abar{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:16px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#sel-info{font-size:13px;color:rgba(255,255,255,.5);flex:1;line-height:1.5}
.btn-rnd{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.7);border-radius:10px;padding:11px 18px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-rnd:hover{border-color:rgba(255,255,255,.25)}
.btn-set{background:linear-gradient(135deg,#f59e0b,#d97706);color:#000;border:none;border-radius:10px;padding:11px 24px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(245,158,11,.35);transition:all .15s}
.btn-set:hover{transform:translateY(-1px)}
.btn-set:disabled{opacity:.5;cursor:not-allowed;transform:none}

#winners-sec{display:none;margin-top:28px}
.tbox{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:14px;overflow:hidden}
.wtable{width:100%;border-collapse:collapse}
.wtable th{text-align:left;padding:10px 14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.3);border-bottom:1px solid rgba(255,255,255,.07)}
.wtable td{padding:12px 14px;font-size:13px;border-bottom:1px solid rgba(255,255,255,.05)}
.wtable tr:last-child td{border-bottom:none}
.rm-btn{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fca5a5;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;font-family:inherit}
.rm-btn:hover{background:rgba(239,68,68,.2)}

#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;padding:12px 22px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;transition:all .3s;z-index:9999;pointer-events:none;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{border:1px solid rgba(34,197,94,.4);color:#86efac}
#toast.err{border:1px solid rgba(239,68,68,.4);color:#fca5a5}
#toast.info{border:1px solid rgba(245,158,11,.4);color:#fcd34d}
</style>
</head>
<body>

<!-- PIN -->
<div id="pin-screen">
  <div class="pin-card">
    <div style="font-size:48px;margin-bottom:12px">🔐</div>
    <div style="font-size:22px;font-weight:800;margin-bottom:6px">Secret Panel</div>
    <div style="font-size:13px;color:rgba(255,255,255,.4);margin-bottom:4px">Lucky Draw — Admin Only</div>
    <div class="pin-dots">
      <div class="pin-dot" id="pd0"></div>
      <div class="pin-dot" id="pd1"></div>
      <div class="pin-dot" id="pd2"></div>
      <div class="pin-dot" id="pd3"></div>
    </div>
    <div class="numpad">
      <button class="nk" onclick="pk('1')">1</button>
      <button class="nk" onclick="pk('2')">2</button>
      <button class="nk" onclick="pk('3')">3</button>
      <button class="nk" onclick="pk('4')">4</button>
      <button class="nk" onclick="pk('5')">5</button>
      <button class="nk" onclick="pk('6')">6</button>
      <button class="nk" onclick="pk('7')">7</button>
      <button class="nk" onclick="pk('8')">8</button>
      <button class="nk" onclick="pk('9')">9</button>
      <div></div>
      <button class="nk" onclick="pk('0')">0</button>
      <button class="nk" onclick="pdel()">⌫</button>
    </div>
    <div id="pin-err"></div>
  </div>
</div>

<!-- Main -->
<div id="main">
  <div class="bar">
    <span style="font-size:20px">🎰</span>
    <span class="bar-title">Lucky Draw — Secret Panel</span>
    <span class="bar-evt" id="bar-evt">No event selected</span>
    <button class="lock-btn" onclick="doLock()">🔒 Lock</button>
  </div>

  <div class="wrap">

    <!-- Event selector -->
    <div class="sec-label">Select Event</div>
    <select class="esel" id="esel" onchange="onEvt()">
      <option value="">— Choose an event —</option>
    </select>

    <!-- Visitor picker section -->
    <div id="picker">

      <!-- Current forced winner status -->
      <div id="forced-status">
        <div class="fs-label">✅ Next winner is pre-selected</div>
        <div class="fs-name" id="forced-name">—</div>
        <div class="fs-sub" id="forced-sub">When the organizer spins, this person will win</div>
        <button class="btn-clear-forced" onclick="clearForced()">✕ Clear — let next spin be random</button>
      </div>

      <!-- Visitor list -->
      <div class="sec-label">Select the next winner (search by name or mobile)</div>
      <input class="srch" id="srch" placeholder="Search by name, mobile, company..." oninput="doSearch()">
      <div id="vcount"></div>
      <div id="vlist"><div style="padding:20px;text-align:center;color:rgba(255,255,255,.3);font-size:13px">Select an event to load visitors</div></div>

      <!-- Action bar -->
      <div class="abar">
        <div id="sel-info">No visitor selected</div>
        <button class="btn-rnd" onclick="clearSel()">↺ Clear Selection</button>
        <button class="btn-set" id="btn-set" onclick="doSet()">🎯 Set as Next Winner</button>
      </div>

    </div><!-- /picker -->

    <!-- Past winners -->
    <div id="winners-sec">
      <div class="sec-label" style="margin-bottom:10px">
        Past Winners <span id="wcnt" style="color:rgba(255,255,255,.4);font-weight:400"></span>
      </div>
      <div class="tbox">
        <div id="wtbody"></div>
      </div>
    </div>

  </div>
</div>

<div id="toast"></div>

<script>
// ── Change PIN here ───────────────────────────────────────────
var PIN = "2857";

// ── State ─────────────────────────────────────────────────────
var pin = "";
var eventId = "";
var allVisitors = [];  // eligible (not yet won)
var wonIds = [];       // visitor IDs that already won
var selId = "";
var selName = "";
var token = localStorage.getItem("lk_admin_token") || "";
var API = "/api/v1/super_admin";

// ── PIN functions ─────────────────────────────────────────────
function pk(k) {
  if (pin.length >= 4) return;
  pin += k;
  renderDots();
  if (pin.length === 4) setTimeout(checkPin, 150);
}

function pdel() {
  pin = pin.slice(0, -1);
  renderDots();
}

function renderDots() {
  for (var i = 0; i < 4; i++) {
    document.getElementById("pd" + i).className = "pin-dot" + (i < pin.length ? " on" : "");
  }
}

function checkPin() {
  if (pin === PIN) {
    document.getElementById("pin-screen").style.display = "none";
    document.getElementById("main").style.display = "flex";
    fetchEvents();
  } else {
    pin = "";
    renderDots();
    var e = document.getElementById("pin-err");
    e.textContent = "Wrong PIN. Try again.";
    setTimeout(function() { e.textContent = ""; }, 2000);
  }
}

function doLock() {
  pin = "";
  renderDots();
  eventId = "";
  document.getElementById("pin-screen").style.display = "flex";
  document.getElementById("main").style.display = "none";
}

// ── API helpers ───────────────────────────────────────────────
function apiGet(url) {
  return fetch(url, {
    headers: { "Authorization": "Bearer " + token }
  }).then(function(r) { return r.json(); });
}

function apiPost(url, body) {
  return fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
    body: JSON.stringify(body || {})
  }).then(function(r) { return r.json(); });
}

function apiPatch(url, body) {
  return fetch(url, {
    method: "PATCH",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
    body: JSON.stringify(body || {})
  }).then(function(r) { return r.json(); });
}

function apiDel(url) {
  return fetch(url, {
    method: "DELETE",
    headers: { "Authorization": "Bearer " + token }
  }).then(function(r) { return r.json(); });
}

// ── Events ────────────────────────────────────────────────────
function fetchEvents() {
  apiGet(API + "/events?per_page=100").then(function(res) {
    var evts = res.data || res.events || [];
    var sel = document.getElementById("esel");
    sel.innerHTML = '<option value="">— Choose an event —</option>' +
      evts.map(function(e) {
        return '<option value="' + e.id + '">' + e.name + ' (' + (e.status || "") + ')</option>';
      }).join("");
  }).catch(function() {
    toast("Failed to load events. Check admin login.", "err");
  });
}

function onEvt() {
  var sel = document.getElementById("esel");
  eventId = sel.value;

  if (!eventId) {
    document.getElementById("picker").style.display = "none";
    document.getElementById("winners-sec").style.display = "none";
    document.getElementById("bar-evt").textContent = "No event selected";
    return;
  }

  document.getElementById("bar-evt").textContent = sel.options[sel.selectedIndex].text;
  document.getElementById("picker").style.display = "block";
  document.getElementById("winners-sec").style.display = "block";

  // Reset state
  selId = "";
  selName = "";
  document.getElementById("srch").value = "";
  updateSelInfo();

  // Load winners first (to get wonIds), then load visitors
  fetchWinners(function() {
    fetchForcedWinner();
    fetchVisitors();
  });
}

// ── Visitors ──────────────────────────────────────────────────
function fetchVisitors() {
  var vl = document.getElementById("vlist");
  vl.innerHTML = '<div style="padding:20px;text-align:center;color:rgba(255,255,255,.3);font-size:13px">Loading visitors...</div>';

  // Use the correct endpoint: /api/v1/super_admin/visitors?event_id=xxx
  apiGet(API + "/visitors?event_id=" + eventId + "&per_page=500")
  .then(function(res) {
    var all = res.data || [];
    // Filter out already-won visitors
    allVisitors = all.filter(function(v) {
      return wonIds.indexOf(v.id) === -1;
    });
    renderList(allVisitors);
  })
  .catch(function(err) {
    vl.innerHTML = '<div style="padding:20px;text-align:center;color:#ef4444;font-size:13px">Failed to load visitors.<br>Make sure you are logged into admin portal first.</div>';
  });
}

function renderList(list) {
  var vc = document.getElementById("vcount");
  var vl = document.getElementById("vlist");

  vc.textContent = list.length + " eligible visitor" + (list.length !== 1 ? "s" : "") +
    (wonIds.length ? " · " + wonIds.length + " already won" : "");

  if (!list.length) {
    vl.innerHTML = '<div style="padding:20px;text-align:center;color:rgba(255,255,255,.3);font-size:13px">' +
      (wonIds.length ? "All visitors have already won!" : "No registered visitors found for this event.") +
      '</div>';
    return;
  }

  var colors = ["#6c63ff","#f59e0b","#22c55e","#ef4444","#3b82f6","#ec4899","#14b8a6"];
  vl.innerHTML = list.map(function(v) {
    var initials = ((v.full_name || "?").split(" ").map(function(w) { return w[0]; }).join("").toUpperCase().slice(0, 2));
    var color = colors[((v.full_name || "").charCodeAt(0) || 0) % colors.length];
    var isSel = v.id === selId;
    // Safely encode name for onclick
    var safeName = (v.full_name || "Unknown").replace(/\\/g, "\\\\").replace(/'/g, "\\'");
    return '<div class="vrow' + (isSel ? " sel" : "") + '" onclick="pickV(\'' + v.id + '\',\'' + safeName + '\')">' +
      '<div class="vav" style="background:' + color + '">' + initials + '</div>' +
      '<div style="flex:1;min-width:0">' +
        '<div class="vname">' + (v.full_name || "Unknown") + '</div>' +
        '<div class="vmeta">' + (v.mobile_number || "—") + (v.business_name ? "  ·  " + v.business_name : "") + '</div>' +
      '</div>' +
      '<div class="vchk">✅</div>' +
    '</div>';
  }).join("");
}

function doSearch() {
  var q = document.getElementById("srch").value.trim().toLowerCase();
  if (!q) { renderList(allVisitors); return; }
  var filtered = allVisitors.filter(function(v) {
    var name  = (v.full_name || "").toLowerCase();
    var mobile = (v.mobile_number || "").replace(/[\s+]/g, "");
    var biz   = (v.business_name || "").toLowerCase();
    var qMob  = q.replace(/[\s+]/g, "");
    return name.includes(q) || mobile.includes(qMob) || biz.includes(q);
  });
  renderList(filtered);
}

function pickV(id, name) {
  if (selId === id) { clearSel(); return; }
  selId = id;
  selName = name;
  updateSelInfo();
  doSearch(); // re-render to highlight selection
}

function clearSel() {
  selId = "";
  selName = "";
  updateSelInfo();
  doSearch();
}

function updateSelInfo() {
  var el = document.getElementById("sel-info");
  if (selId) {
    el.innerHTML = 'Selected: <strong style="color:#f59e0b">' + selName + '</strong><br>' +
      '<span style="font-size:11px;color:rgba(255,255,255,.35)">Click "Set as Next Winner" to confirm</span>';
  } else {
    el.innerHTML = '<span style="color:rgba(255,255,255,.4)">No visitor selected — select someone above</span>';
  }
}

// ── Set forced winner ─────────────────────────────────────────
function doSet() {
  if (!eventId || !selId) {
    toast("Please select a visitor first", "err");
    return;
  }
  var btn = document.getElementById("btn-set");
  btn.disabled = true;
  btn.textContent = "Setting...";

  apiPatch(API + "/events/" + eventId + "/lucky_draw_results/forced_winner", {
    visitor_id: selId
  })
  .then(function(res) {
    if (res.success) {
      toast("✅ " + selName + " will be the next winner!", "ok");
      clearSel();
      fetchForcedWinner(); // refresh status card
    } else {
      toast(res.error || "Failed to set winner", "err");
    }
    btn.disabled = false;
    btn.textContent = "🎯 Set as Next Winner";
  })
  .catch(function() {
    toast("Network error. Try again.", "err");
    btn.disabled = false;
    btn.textContent = "🎯 Set as Next Winner";
  });
}

// ── Fetch & display forced winner status ──────────────────────
function fetchForcedWinner() {
  apiGet(API + "/events/" + eventId + "/lucky_draw_results/forced_winner")
  .then(function(res) {
    var card = document.getElementById("forced-status");
    if (res.success && res.data && res.data.forced && res.data.visitor) {
      var v = res.data.visitor;
      document.getElementById("forced-name").textContent = v.full_name;
      document.getElementById("forced-sub").textContent = (v.mobile_number || "") +
        " — When the organizer spins next, this person will win";
      card.style.display = "block";
    } else {
      card.style.display = "none";
    }
  })
  .catch(function() {
    document.getElementById("forced-status").style.display = "none";
  });
}

function clearForced() {
  if (!confirm("Clear pre-selected winner? The next spin will be random.")) return;
  apiPatch(API + "/events/" + eventId + "/lucky_draw_results/forced_winner", {
    visitor_id: null
  })
  .then(function(res) {
    if (res.success) {
      toast("Cleared — next spin will be random", "info");
      document.getElementById("forced-status").style.display = "none";
    }
  });
}

// ── Winners table ─────────────────────────────────────────────
function fetchWinners(cb) {
  apiGet(API + "/events/" + eventId + "/lucky_draw_results")
  .then(function(res) {
    var results = (res.data || []).slice().reverse(); // latest first
    wonIds = results.map(function(r) { return r.visitor && r.visitor.id; }).filter(Boolean);

    var wcnt = document.getElementById("wcnt");
    wcnt.textContent = results.length ? "(" + results.length + ")" : "";

    var wb = document.getElementById("wtbody");
    if (!results.length) {
      wb.innerHTML = '<div style="padding:24px;text-align:center;color:rgba(255,255,255,.3);font-size:13px">No winners yet</div>';
    } else {
      wb.innerHTML = '<table class="wtable">' +
        '<thead><tr><th>#</th><th>Name</th><th>Mobile</th><th>Business</th><th>Location</th><th>Time</th><th></th></tr></thead>' +
        '<tbody>' +
        results.map(function(r) {
          var v = r.visitor;
          var isLatest = results.indexOf(r) === 0;
          return '<tr style="' + (isLatest ? "background:rgba(245,158,11,.04)" : "") + '">' +
            '<td style="font-weight:800;color:#f59e0b">' + r.round +
              (isLatest ? ' <span style="font-size:10px;background:rgba(245,158,11,.2);color:#f59e0b;border-radius:10px;padding:1px 7px">LATEST</span>' : '') +
            '</td>' +
            '<td style="font-weight:600">' + (v.full_name || "—") + '</td>' +
            '<td style="font-family:monospace;font-size:12px">' + (v.mobile_number || "—") + '</td>' +
            '<td style="color:rgba(255,255,255,.6)">' + (v.business_name || "—") + '</td>' +
            '<td style="color:rgba(255,255,255,.6)">' + (v.location || "—") + '</td>' +
            '<td style="color:rgba(255,255,255,.4);font-size:12px;white-space:nowrap">' +
              new Date(r.drawn_at).toLocaleString("en-IN", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }) +
            '</td>' +
            '<td><button class="rm-btn" onclick="removeWinner(\'' + r.id + '\')">Remove</button></td>' +
          '</tr>';
        }).join("") +
        '</tbody></table>';
    }

    if (typeof cb === "function") cb();
  })
  .catch(function() {
    document.getElementById("wtbody").innerHTML = '<div style="padding:20px;text-align:center;color:#ef4444;font-size:13px">Failed to load winners.</div>';
    if (typeof cb === "function") cb();
  });
}

function removeWinner(rid) {
  if (!confirm("Remove this winner? They will become eligible again.")) return;
  apiDel(API + "/events/" + eventId + "/lucky_draw_results/" + rid)
  .then(function(res) {
    if (res.success) {
      toast("Winner removed", "ok");
      fetchWinners(function() { fetchVisitors(); });
    } else {
      toast(res.error || "Failed", "err");
    }
  });
}

// ── Toast ─────────────────────────────────────────────────────
function toast(msg, type) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast " + (type || "ok") + " show";
  clearTimeout(t._timer);
  t._timer = setTimeout(function() { t.classList.remove("show"); }, 3500);
}
</script>
</body>
