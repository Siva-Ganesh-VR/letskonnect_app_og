<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lucky Draw — Secret Panel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a14;color:#fff;min-height:100vh}

/* Login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:#12121f;border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:40px 32px;width:100%;max-width:380px;text-align:center}
.login-icon{font-size:48px;margin-bottom:16px}
.login-title{font-size:22px;font-weight:800;margin-bottom:6px}
.login-sub{font-size:13px;color:rgba(255,255,255,.4);margin-bottom:28px}
.pin-wrap{display:flex;justify-content:center;gap:10px;margin-bottom:20px}
.pin-dot{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);transition:all .2s}
.pin-dot.filled{background:#f59e0b;border-color:#f59e0b;box-shadow:0 0 10px rgba(245,158,11,.5)}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:240px;margin:0 auto}
.num-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:#fff;border-radius:12px;padding:16px;font-size:20px;font-weight:700;cursor:pointer;transition:all .15s;font-family:inherit}
.num-btn:hover{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.3)}
.num-btn:active{transform:scale(.95)}
.num-btn.del{font-size:18px;color:rgba(255,255,255,.5)}
.pin-error{color:#ef4444;font-size:13px;margin-top:12px;opacity:0;transition:opacity .3s}
.pin-error.show{opacity:1}

/* Main panel */
.panel{display:none;min-height:100vh}
.topbar{background:#12121f;border-bottom:1px solid rgba(255,255,255,.07);padding:14px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.topbar-title{font-size:16px;font-weight:800}
.topbar-sub{font-size:12px;color:rgba(255,255,255,.4);margin-left:auto}
.lock-btn{background:none;border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.5);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit}

.content{max-width:1000px;margin:0 auto;padding:28px 20px}

/* Event selector */
.section{margin-bottom:28px}
.section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.35);margin-bottom:10px}
.event-sel{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:13px 16px;color:#fff;font-size:15px;outline:none;cursor:pointer}
.event-sel:focus{border-color:#f59e0b}
.event-sel option{background:#12121f}

/* Visitor search */
.search-box{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:13px 16px;color:#fff;font-size:14px;outline:none;margin-bottom:12px}
.search-box:focus{border-color:#f59e0b}
.search-box::placeholder{color:rgba(255,255,255,.3)}

/* Visitor list */
.visitor-list{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow-y:auto}
.visitor-row{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:13px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .15s}
.visitor-row:hover{border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.05)}
.visitor-row.selected{border-color:#f59e0b;background:rgba(245,158,11,.1)}
.v-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;flex-shrink:0}
.v-name{font-size:14px;font-weight:600}
.v-meta{font-size:12px;color:rgba(255,255,255,.4);margin-top:2px}
.v-check{margin-left:auto;font-size:20px;opacity:0;transition:opacity .15s}
.visitor-row.selected .v-check{opacity:1}

/* Action buttons */
.action-bar{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:16px 20px;display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.selected-info{font-size:13px;color:rgba(255,255,255,.5);flex:1}
.selected-name{font-weight:700;color:#f59e0b}
.btn-force{background:linear-gradient(135deg,#f59e0b,#d97706);color:#000;border:none;border-radius:10px;padding:12px 24px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 4px 16px rgba(245,158,11,.4);transition:all .2s}
.btn-force:hover{transform:translateY(-1px)}
.btn-force:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-random{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.7);border-radius:10px;padding:12px 20px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s}

/* Past winners */
.winners-table{width:100%;border-collapse:collapse;margin-top:4px}
.winners-table th{text-align:left;padding:10px 14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.3);border-bottom:1px solid rgba(255,255,255,.07)}
.winners-table td{padding:11px 14px;font-size:13px;border-bottom:1px solid rgba(255,255,255,.05)}
.winners-table tr:last-child td{border-bottom:none}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;padding:12px 22px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;transition:all .3s;z-index:9999;pointer-events:none;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{border:1px solid rgba(34,197,94,.4);color:#86efac}
.toast.err{border:1px solid rgba(239,68,68,.4);color:#fca5a5}
</style>
</head>
<body>

<!-- PIN Login -->
<div class="login-wrap" id="login-screen">
  <div class="login-card">
    <div class="login-icon">🔐</div>
    <div class="login-title">Secret Panel</div>
    <div class="login-sub">Lucky Draw — Admin Access Only</div>
    <div class="pin-wrap">
      <div class="pin-dot" id="d0"></div>
      <div class="pin-dot" id="d1"></div>
      <div class="pin-dot" id="d2"></div>
      <div class="pin-dot" id="d3"></div>
    </div>
    <div class="numpad">
      <button class="num-btn" onclick="pinKey('1')">1</button>
      <button class="num-btn" onclick="pinKey('2')">2</button>
      <button class="num-btn" onclick="pinKey('3')">3</button>
      <button class="num-btn" onclick="pinKey('4')">4</button>
      <button class="num-btn" onclick="pinKey('5')">5</button>
      <button class="num-btn" onclick="pinKey('6')">6</button>
      <button class="num-btn" onclick="pinKey('7')">7</button>
      <button class="num-btn" onclick="pinKey('8')">8</button>
      <button class="num-btn" onclick="pinKey('9')">9</button>
      <button class="num-btn" onclick="pinKey('0')">0</button>
      <button class="num-btn del" onclick="pinDel()">⌫</button>
    </div>
    <div class="pin-error" id="pin-error">Incorrect PIN. Try again.</div>
  </div>
</div>

<!-- Main Panel -->
<div class="panel" id="main-panel">
  <div class="topbar">
    <span style="font-size:22px">🎰</span>
    <div>
      <div class="topbar-title">Lucky Draw — Secret Panel</div>
    </div>
    <span class="topbar-sub" id="tb-event">No event selected</span>
    <button class="lock-btn" onclick="lockPanel()">🔒 Lock</button>
  </div>

  <div class="content">

    <!-- Event selector -->
    <div class="section">
      <div class="section-label">Select Event</div>
      <select class="event-sel" id="event-sel" onchange="onEventChange()">
        <option value="">— Choose an event —</option>
      </select>
    </div>

    <!-- Visitor selector -->
    <div class="section" id="visitor-section" style="display:none">
      <div class="section-label">Choose Winner (or leave empty for random)</div>
      <input class="search-box" id="visitor-search" placeholder="Search by name, mobile, company..." oninput="filterVisitors()">
      <div class="visitor-list" id="visitor-list"></div>

      <div class="action-bar">
        <div class="selected-info">
          <span id="selected-label">No visitor selected — will pick randomly</span>
        </div>
        <button class="btn-random" onclick="clearSelection()">↺ Random</button>
        <button class="btn-force" id="force-btn" onclick="forceWinner()">🎯 Set as Winner</button>
      </div>
    </div>

    <!-- Past winners -->
    <div class="section" id="winners-section" style="display:none">
      <div class="section-label">Past Winners <span id="winners-count"></span></div>
      <div style="background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:14px;overflow:hidden">
        <div id="winners-table-wrap"><div style="padding:24px;text-align:center;color:rgba(255,255,255,.3);font-size:13px">No winners yet</div></div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── PIN Auth ──────────────────────────────────────────────────
// Change this PIN to whatever you want
var SECRET_PIN = "1234";
var pinEntry = "";

function pinKey(k) {
  if (pinEntry.length >= 4) return;
  pinEntry += k;
  updateDots();
  if (pinEntry.length === 4) {
    setTimeout(checkPin, 200);
  }
}

function pinDel() {
  pinEntry = pinEntry.slice(0, -1);
  updateDots();
}

function updateDots() {
  for (var i = 0; i < 4; i++) {
    var d = document.getElementById("d" + i);
    d.className = "pin-dot" + (i < pinEntry.length ? " filled" : "");
  }
}

function checkPin() {
  if (pinEntry === SECRET_PIN) {
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("main-panel").style.display = "block";
    loadEvents();
  } else {
    pinEntry = "";
    updateDots();
    var err = document.getElementById("pin-error");
    err.classList.add("show");
    setTimeout(function() { err.classList.remove("show"); }, 2000);
    // Shake animation
    var wrap = document.querySelector(".pin-wrap");
    wrap.style.animation = "none";
    wrap.style.transform = "translateX(-10px)";
    setTimeout(function() {
      wrap.style.transition = "transform .4s";
      wrap.style.transform = "translateX(0)";
    }, 50);
  }
}

function lockPanel() {
  pinEntry = "";
  updateDots();
  document.getElementById("login-screen").style.display = "flex";
  document.getElementById("main-panel").style.display = "none";
}

// ── API helpers ───────────────────────────────────────────────
var API_BASE = "/api/v1/super_admin";
var token = localStorage.getItem("lk_admin_token") || "";

function apiGet(url) {
  return fetch(url, { headers: { "Authorization": "Bearer " + token } }).then(function(r) { return r.json(); });
}

function apiPost(url, body) {
  return fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
    body: JSON.stringify(body || {})
  }).then(function(r) { return r.json(); });
}

// ── Events ────────────────────────────────────────────────────
var allVisitors = [], selectedVisitorId = null, currentEventId = null, currentWinnerIds = [];

function loadEvents() {
  apiGet(API_BASE + "/events?per_page=100").then(function(res) {
    var events = (res.data || res.events || []);
    var sel = document.getElementById("event-sel");
    sel.innerHTML = '<option value="">— Choose an event —</option>' +
      events.map(function(e) {
        return '<option value="' + e.id + '">' + e.name + ' (' + (e.status || '') + ')</option>';
      }).join("");
  });
}

function onEventChange() {
  var sel = document.getElementById("event-sel");
  currentEventId = sel.value;
  if (!currentEventId) {
    document.getElementById("visitor-section").style.display = "none";
    document.getElementById("winners-section").style.display = "none";
    return;
  }
  document.getElementById("tb-event").textContent = sel.options[sel.selectedIndex].text;
  document.getElementById("visitor-section").style.display = "block";
  document.getElementById("winners-section").style.display = "block";
  loadWinners();
  // Load visitors after winners so won IDs are known
  setTimeout(loadVisitors, 300);
}

// ── Visitors ──────────────────────────────────────────────────
function loadVisitors() {
  if (!currentEventId) return;
  var list = document.getElementById("visitor-list");
  list.innerHTML = '<div style="padding:20px;text-align:center;color:rgba(255,255,255,.3)">Loading visitors...</div>';
  // Use the top-level visitors endpoint filtered by event_id
  apiGet(API_BASE + "/visitors?event_id=" + currentEventId + "&per_page=500&mobile_verified=true")
  .then(function(res) {
    allVisitors = res.data || [];
    // Filter out already-won visitors
    var wonIds = currentWinnerIds || [];
    allVisitors = allVisitors.filter(function(v) {
      return wonIds.indexOf(v.id) === -1;
    });
    renderVisitors(allVisitors);
    if (!allVisitors.length) {
      list.innerHTML = '<div style="padding:20px;text-align:center;color:rgba(255,255,255,.3);font-size:13px">No eligible visitors — all may have already won, or none registered yet.</div>';
    }
  })
  .catch(function(e) {
    list.innerHTML = '<div style="padding:20px;text-align:center;color:#ef4444;font-size:13px">Failed to load visitors. Check your admin token.</div>';
  });
}

function renderVisitors(visitors) {
  var list = document.getElementById("visitor-list");
  if (!visitors.length) {
    list.innerHTML = '<div style="padding:20px;text-align:center;color:rgba(255,255,255,.3);font-size:13px">No visitors found</div>';
    return;
  }
  var colors = ["#6c63ff","#f59e0b","#22c55e","#ef4444","#3b82f6","#ec4899","#14b8a6"];
  list.innerHTML = visitors.map(function(v) {
    var initials = ((v.full_name||"?").split(" ").map(function(w){return w[0];}).join("").toUpperCase().slice(0,2));
    var color = colors[((v.full_name||"").charCodeAt(0)||0) % colors.length];
    var isSel = v.id === selectedVisitorId;
    return '<div class="visitor-row' + (isSel ? " selected" : "") + '" onclick="selectVisitor(\'' + v.id + '\',\'' + (v.full_name||"").replace(/'/g,"") + '\')">' +
      '<div class="v-avatar" style="background:' + color + '">' + initials + '</div>' +
      '<div>' +
        '<div class="v-name">' + (v.full_name||"Unknown") + '</div>' +
        '<div class="v-meta">' + (v.mobile_number||"") + (v.business_name ? " · " + v.business_name : "") + '</div>' +
      '</div>' +
      '<div class="v-check">✅</div>' +
    '</div>';
  }).join("");
}

function filterVisitors() {
  var q = document.getElementById("visitor-search").value.toLowerCase();
  if (!q) { renderVisitors(allVisitors); return; }
  renderVisitors(allVisitors.filter(function(v) {
    return (v.full_name||"").toLowerCase().includes(q) ||
           (v.mobile_number||"").includes(q) ||
           (v.business_name||"").toLowerCase().includes(q);
  }));
}

function selectVisitor(id, name) {
  if (selectedVisitorId === id) {
    clearSelection(); return;
  }
  selectedVisitorId = id;
  document.getElementById("selected-label").innerHTML = 'Selected: <span class="selected-name">' + name + '</span>';
  filterVisitors();
}

function clearSelection() {
  selectedVisitorId = null;
  document.getElementById("selected-label").textContent = "No visitor selected — will pick randomly";
  filterVisitors();
}

// ── Force winner ──────────────────────────────────────────────
function forceWinner() {
  if (!currentEventId) return;
  var btn = document.getElementById("force-btn");
  btn.disabled = true;
  btn.textContent = "Setting winner...";

  // If a specific visitor is selected, use force endpoint
  // Otherwise use normal random spin
  var url = API_BASE + "/events/" + currentEventId + "/lucky_draw_results";
  var body = selectedVisitorId ? { visitor_id: selectedVisitorId } : {};

  apiPost(url, body).then(function(res) {
    if (res.success) {
      var v = res.data.visitor;
      showToast("🏆 Winner set: " + v.full_name, "ok");
      clearSelection();
      loadWinners();
      setTimeout(loadVisitors, 500); // refresh to remove winner from list
    } else {
      showToast(res.error || "Failed to set winner", "err");
    }
    btn.disabled = false;
    btn.textContent = "🎯 Set as Winner";
  }).catch(function() {
    showToast("Network error", "err");
    btn.disabled = false;
    btn.textContent = "🎯 Set as Winner";
  });
}

// ── Winners ───────────────────────────────────────────────────
function loadWinners() {
  if (!currentEventId) return;
  apiGet(API_BASE + "/events/" + currentEventId + "/lucky_draw_results").then(function(res) {
    var results = (res.data || []).slice().reverse();
    // Track won visitor IDs to exclude from picker
    currentWinnerIds = results.map(function(r) { return r.visitor && r.visitor.id; }).filter(Boolean);
    document.getElementById("winners-count").textContent = results.length ? "(" + results.length + ")" : "";
    var wrap = document.getElementById("winners-table-wrap");
    if (!results.length) {
      wrap.innerHTML = '<div style="padding:24px;text-align:center;color:rgba(255,255,255,.3);font-size:13px">No winners yet</div>';
      return;
    }
    wrap.innerHTML = '<table class="winners-table">' +
      '<thead><tr><th>#</th><th>Name</th><th>Mobile</th><th>Business</th><th>Location</th><th>Time</th><th>Action</th></tr></thead>' +
      '<tbody>' +
      results.map(function(r) {
        var v = r.visitor;
        return '<tr>' +
          '<td style="font-weight:800;color:#f59e0b">' + r.round + '</td>' +
          '<td style="font-weight:600">' + (v.full_name||"—") + '</td>' +
          '<td style="font-family:monospace">' + (v.mobile_number||"—") + '</td>' +
          '<td style="color:rgba(255,255,255,.6)">' + (v.business_name||"—") + '</td>' +
          '<td style="color:rgba(255,255,255,.6)">' + (v.location||"—") + '</td>' +
          '<td style="color:rgba(255,255,255,.4);font-size:12px">' + new Date(r.drawn_at).toLocaleString("en-IN",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}) + '</td>' +
          '<td><button onclick="deleteWinner(\'' + r.id + '\')" style="background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fca5a5;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;font-family:inherit">Remove</button></td>' +
        '</tr>';
      }).join("") +
      '</tbody></table>';
  });
}

function deleteWinner(resultId) {
  if (!confirm("Remove this winner?")) return;
  fetch(API_BASE + "/events/" + currentEventId + "/lucky_draw_results/" + resultId, {
    method: "DELETE",
    headers: { "Authorization": "Bearer " + token }
  }).then(function(r) { return r.json(); }).then(function(res) {
    if (res.success) { showToast("Winner removed", "ok"); loadWinners(); }
    else showToast(res.error || "Failed", "err");
  });
}

// ── Toast ─────────────────────────────────────────────────────
function showToast(msg, type) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast " + (type||"ok") + " show";
  clearTimeout(t._t);
  t._t = setTimeout(function() { t.classList.remove("show"); }, 3000);
}
</script>
</body>
</html>
